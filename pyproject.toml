[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "statd2gan"
version = "2.0.0"
description = "Multi-discriminator GAN for synthetic multivariate weather sequences (held-out v2 protocol)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[tool.setuptools.packages.find]
where = ["src"]
